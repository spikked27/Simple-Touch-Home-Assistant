name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install aiohttp
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/protocol_test.cpp -o /tmp/protocol-test && /tmp/protocol-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/motion_test.cpp -o /tmp/motion-test && /tmp/motion-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/local_access_test.cpp -o /tmp/local-access-test && /tmp/local-access-test
      - run: python -m compileall -q custom_components
      - run: node --test tests/updater_test.cjs
      - run: python scripts/embed_web.py && git diff --exit-code firmware/simple_touch/web_ui.h
  ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant-custom-component==0.13.369
      - run: PYTHONPATH=. pytest -q tests/ha
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
          git clone --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson.git /tmp/ArduinoJson
          git clone https://github.com/jnthas/Improv-WiFi-Library.git /tmp/ImprovWiFi
          git -C /tmp/ImprovWiFi checkout e37c244e0080349e191252acf4bce146eca118e0
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,FlashMode=dio --library /tmp/ArduinoJson --library /tmp/ImprovWiFi --output-dir build firmware/simple_touch
          cp build/simple_touch.ino.merged.bin site/firmware.bin
          cp build/simple_touch.ino.bin site/simple-touch-esp32s3-update.bin
          python scripts/package_update.py
      - uses: actions/upload-artifact@v4
        with:
          name: xiao-esp32s3-firmware
          path: build/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: browser-installer
          path: site/
  publish-installer:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, ha-tests, hassfest, hacs, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-installer
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish installer
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [publish-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: simple-touch-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-installer
          path: release-assets
      - name: Publish a new stable version after all checks and installer deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version site/manifest.json)
          [[ "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || exit 0
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          test -f "docs/releases/$version.md"
          cp release-assets/firmware.bin release-assets/simple-touch-esp32s3-install.bin
          gh release create "$tag" --target "$GITHUB_SHA" --title "Simple Touch $tag" \
            --notes-file "docs/releases/$version.md" \
            release-assets/simple-touch-esp32s3-update.bin \
            release-assets/simple-touch-esp32s3-install.bin \
            release-assets/updates.json
