<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Simple Touch · Your shades</title>
<style>
:root{--ink:#24352f;--muted:#66756e;--paper:#f5f5ef;--white:#fff;--line:#dfe5dc;--green:#285d49;--lime:#e0edb9;--orange:#bd512e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 17px;background:white;color:var(--ink);font-weight:600}button:hover{background:#edf2e6}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #bd512e;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#1f4939}.quiet{background:transparent;border-color:transparent}.danger{color:#a83d29}header{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1120px)/2));gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.5px;font-size:22px}.logo{width:34px;height:37px;border:3px solid var(--green);border-radius:6px;background:repeating-linear-gradient(0deg,transparent 0 5px,var(--green) 5px 8px)}.badge{font-size:12px;font-weight:600;padding:6px 11px;background:var(--lime);border-radius:30px;white-space:nowrap}main{max-width:1120px;margin:auto;padding:56px 24px 80px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:750;color:var(--green)}h1{font-size:clamp(32px,5vw,48px);line-height:1.1;font-weight:550;letter-spacing:-2px;margin:12px 0 14px}p{color:var(--muted);margin:10px 0}h2{font-size:24px;letter-spacing:-.7px;margin:10px 0}h3{font-size:20px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 3px 5px #24352f03}.cardtop{display:flex;justify-content:space-between;gap:10px}.shade-art{height:130px;margin:22px 0;background:#f1f3ec;border-radius:12px;display:grid;place-items:center}.window{width:92px;height:91px;border:3px solid #96ad9a;border-radius:3px;position:relative;background:#e7edc8}.window:before{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:56px;border:3px solid #456653;background:repeating-linear-gradient(0deg,#a5b894 0 6px,#769371 6px 8px)}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.controls button{padding:12px 7px}.controls .stop{background:var(--green);color:white}.meta{font-size:12px;color:var(--muted)}.small{font-size:13px}.footer{margin-top:32px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px}.empty{text-align:center;padding:60px 24px;background:#eef1e6;border:1px dashed #aabd9d;border-radius:20px}.empty .window{margin:0 auto 28px}.banner{padding:15px 20px;background:#fff0df;border-radius:12px;margin-bottom:20px;color:#7a471f}dialog{border:1px solid var(--line);border-radius:22px;padding:30px;width:min(500px,calc(100vw - 28px));color:var(--ink);box-shadow:0 24px 80px #14332130}dialog::backdrop{background:#12281e70;backdrop-filter:blur(4px)}dialog p{margin:14px 0 22px}.dialogtop{display:flex;justify-content:space-between;align-items:center;gap:16px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;flex-wrap:wrap}label{display:block;font-size:13px;font-weight:600;margin:18px 0 8px}input{width:100%;padding:12px 14px;border:1px solid #bfcbbb;border-radius:10px;background:#fcfcf8;color:var(--ink)}.steps{display:flex;gap:8px;margin:22px 0}.steps span{height:4px;flex:1;background:#dce5d4;border-radius:4px}.steps .active{background:var(--green)}.note{background:#f1f4e9;padding:14px;border-radius:12px;font-size:13px;color:#4b634e}.error{color:#a33b24;font-size:14px;min-height:22px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 24px;border-radius:14px;z-index:5;max-width:90vw}.hide{display:none!important}a{color:var(--green)}details{border-top:1px solid var(--line);margin-top:22px;padding-top:14px}summary{cursor:pointer;font-weight:600}code{overflow-wrap:anywhere}#latency{font-variant-numeric:tabular-nums}@media(max-width:600px){header{height:72px;padding:0 18px}.brand{font-size:19px}main{padding:34px 18px}.intro{align-items:flex-start;flex-direction:column}.intro>button{width:100%}.grid{grid-template-columns:1fr}.card{padding:20px}.footer{display:block}.footer>*{margin-bottom:12px}dialog{padding:24px}}
</style></head><body>
<header><div class="brand"><span class="logo" aria-hidden="true"></span>Simple Touch</div><div><span id="connection" class="badge">Connecting</span> <button id="settings" class="quiet" aria-label="Bridge settings">⚙</button></div></header>
<main><div class="intro"><div><div class="eyebrow">A little more effortless</div><h1>Your shades, in reach.</h1><p>Set the light. Keep the comfort. All controlled locally.</p></div><button class="primary" id="add">＋ Add shade</button></div>
<div id="notice" class="banner hide" role="status"></div><section id="shades" class="grid" aria-label="Your shades"></section>
<div class="footer"><span id="bridge">Simple Touch Bridge</span><span>Local control · <span id="latency">Ready when you are</span></span></div></main>
<dialog id="modal"><div class="dialogtop"><span class="eyebrow" id="modalLabel">Simple Touch</span><button id="close" class="quiet" aria-label="Close dialog">✕</button></div><div id="content"></div><div class="error" id="error" role="alert"></div></dialog><div id="toast" class="toast hide" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),modal=$('#modal');
const provisionKey=new URLSearchParams(location.hash.slice(1)).get('key');
if(provisionKey){sessionStorage.setItem('simpletouch-key',provisionKey);history.replaceState(null,'',location.pathname);}
let key=sessionStorage.getItem('simpletouch-key')||'',state=null,busy=false,pair=null,poll=null,learnTimer=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path,body,method){const r=await fetch('/api/'+path,{method:method||(body?'POST':'GET'),headers:{'Authorization':'Bearer '+key,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Bridge unavailable');return d;}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),3500);}
function show(html,label='Simple Touch'){ $('#content').innerHTML=html;$('#modalLabel').textContent=label;$('#error').textContent='';if(!modal.open)modal.showModal();}
function fail(e){$('#error').textContent=e.message;}
function button(id,fn){$('#'+id).onclick=async()=>{const el=$('#'+id);el.disabled=true;try{await fn();}catch(e){fail(e);}finally{el.disabled=false;}};}
function close(){clearTimeout(learnTimer);modal.close();pair=null;}
$('#close').onclick=close;
modal.addEventListener('cancel',()=>{clearTimeout(learnTimer);pair=null;});
async function refresh(){try{state=await api('state');$('#connection').textContent=state.wifi_connected?'Connected':'Setup Wi-Fi';$('#bridge').textContent='Simple Touch Bridge · '+state.ip+' · v'+state.version;$('#notice').textContent=state.radio_ready?'':'Radio not detected. Check CC1101 wiring before pairing.';$('#notice').classList.toggle('hide',state.radio_ready);render();}catch(e){$('#connection').textContent='Offline';if(!state&&!modal.open)login();}}
function assumed(r){if(r.assumed_state)return ({opening:'Opening · assumed',closing:'Closing · assumed',open:'Open · assumed',closed:'Closed · assumed',partial:'Partially open · assumed',favorite:'Favorite requested',unknown:'Position unknown'})[r.assumed_state]||'Position unknown';return ({up:'Open assumed',down:'Closed assumed',stop:'Stopped · position unknown',favorite:'Favorite requested'})[r.last_command]||'Position unknown';}
function render(){const list=state.remotes;$('#add').disabled=!state.radio_ready||list.length>=state.max_remotes;$('#shades').innerHTML=list.length?list.map(r=>`<article class="card"><div class="cardtop"><div><h3>${esc(r.name)}</h3><div class="meta">${r.paired?'Paired shade':r.pair_sent?'Check pairing result':'Ready to pair'}</div></div><button class="quiet edit" data-id="${r.id}" aria-label="Settings for ${esc(r.name)}">···</button></div><div class="shade-art" aria-hidden="true"><div class="window"></div></div>${r.paired?`<div class="controls"><button data-id="${r.id}" data-command="up" aria-label="Open ${esc(r.name)}">↑ Open</button><button data-id="${r.id}" data-command="stop" class="stop" aria-label="Stop ${esc(r.name)}">■ Stop</button><button data-id="${r.id}" data-command="down" aria-label="Close ${esc(r.name)}">↓ Close</button></div><button class="quiet" data-id="${r.id}" data-command="favorite" aria-label="Favorite position for ${esc(r.name)}">☆ Favorite position</button><p class="meta">${assumed(r)}${r.state_source==='physical_remote'?' · Physical remote':''}</p><button class="quiet link" data-id="${r.id}">Link physical remote · ${(r.physical||[]).length} linked</button>`:`<button class="primary pair" data-id="${r.id}">${r.pair_sent?'Confirm pairing':'Pair shade'}</button>`}</article>`).join(''):`<div class="empty"><div class="window" aria-hidden="true"></div><h2>Let the light in.</h2><p>Add your first shade. We’ll guide you through pairing.</p><button class="primary" id="first">Add your first shade</button></div>`;
document.querySelectorAll('.link').forEach(b=>b.onclick=()=>learnRemote(b.dataset.id).catch(e=>toast(e.message)));$('#first')?.addEventListener('click',addShade);document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.id,b.dataset.command));document.querySelectorAll('.pair').forEach(b=>b.onclick=()=>pairStart(b.dataset.id));document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(b.dataset.id));}
async function command(id,action){if(busy&&action!=='stop'){toast('Finishing the previous command');return;}busy=true;try{const d=await api(`remotes/${id}/command`,{action});$('#latency').textContent=`Last transmission ${d.duration_ms} ms`;toast(action==='stop'?'Stop sent':action==='up'?'Open sent':action==='favorite'?'Favorite position sent':'Close sent');await refresh();}catch(e){toast(e.message);}finally{busy=false;}}
function login(){show('<h2>Welcome home.</h2><p>Enter the bridge key from your setup session to connect.</p><label for="key">Bridge key</label><input id="key" type="password" autocomplete="off"><div class="actions"><button class="primary" id="connect">Connect</button></div>','Connect your bridge');button('connect',async()=>{key=$('#key').value.trim();await api('state');sessionStorage.setItem('simpletouch-key',key);close();await refresh();});}
function addShade(){show('<h2>A name that feels like home.</h2><p>Give this shade a name you’ll recognize in Home Assistant.</p><label for="name">Shade name</label><input id="name" maxlength="48" placeholder="Living room"><div class="actions"><button class="primary" id="create">Continue →</button></div>','Add a shade');button('create',async()=>{const r=await api('remotes',{name:$('#name').value});await refresh();await pairStart(r.id);});$('#name').focus();}
async function pairStart(id){const r=state.remotes.find(r=>r.id===id);pair={id};if(r.pair_sent){pairResult();return;}try{const d=await api(`remotes/${id}/pair/arm`,{});pair.ticket=d.ticket;show(`<div class="steps"><span class="active"></span><span></span><span></span></div><h2>Pair ${esc(r.name)}.</h2><p>Keep the shade powered and its existing remote nearby.</p><div class="note">Use a remote that already controls this shade. Leave other shades you don’t want to pair powered off.</div><div class="actions"><button class="primary" id="pairReady">I have the remote →</button></div>`,'Pairing · 1 of 3');button('pairReady',pairInstructions);}catch(e){toast(e.message);}}
function pairInstructions(){show('<div class="steps"><span class="active"></span><span class="active"></span><span></span></div><h2>Two presses, two jogs.</h2><p>On the existing remote, press <strong>P2 once</strong>. Wait for the shade to jog. Press <strong>P2 again</strong> and wait for one more jog.</p><div class="note">As soon as you see the second jog, tap the button below. The bridge sends the new remote’s P2 immediately.</div><div class="actions"><button class="primary" id="pairSend">Two jogs — pair now</button></div>','Pairing · 2 of 3');button('pairSend',async()=>{await api(`remotes/${pair.id}/pair/send`,{ticket:pair.ticket});pairResult();});}
function pairResult(){show('<div class="steps"><span class="active"></span><span class="active"></span><span class="active"></span></div><h2>Did the shade jog twice?</h2><p>Two jogs after the bridge transmission confirm that the new remote was added.</p><div class="note">Do not repeat the P2 sequence if it succeeded. The same sequence can remove the remote.</div><div class="actions"><button id="unsure">I’m not sure</button><button class="primary" id="confirmed">Yes, two jogs</button></div>','Pairing · 3 of 3');button('confirmed',async()=>{await api(`remotes/${pair.id}/pair/confirm`,{two_jogs:true});close();await refresh();toast('Shade paired. Try Open, Stop and Close.');});button('unsure',async()=>{show('<h2>Let’s check before repeating.</h2><p>Try Open and Stop below. If the shade moves, pairing worked; confirm it. Otherwise, close this dialog and check the setup before creating a fresh remote.</p><div class="actions"><button id="testOpen">Open</button><button id="testStop">Stop</button><button class="primary" id="backResult">Check result</button></div>');button('testOpen',()=>command(pair.id,'up'));button('testStop',()=>command(pair.id,'stop'));button('backResult',pairResult);});}
function edit(id){const r=state.remotes.find(r=>r.id===id);show(`<h2>Shade settings</h2><label for="rename">Name</label><input id="rename" value="${esc(r.name)}" maxlength="48"><label for="travel">Full travel time (seconds)</label><input id="travel" type="number" min="5" max="300" step="1" value="${r.travel_time_s||60}"><p class="small">Time from fully open to fully closed. Stop before this time assumes partially open. No motor position feedback is available.</p><p class="meta">Remote ${esc(id)}</p><details open><summary>Physical remotes</summary><p class="small">Link remotes that already control this shade to keep its assumed state up to date.</p>${(r.physical||[]).map(p=>`<p class="small">${esc(p.id)} <button class="quiet unlink" data-remote="${p.id}">Unlink</button></p>`).join('')}<button id="linkRemote">Link physical remote</button></details><div class="actions"><button class="danger" id="delete">Delete from bridge</button><button class="primary" id="saveName">Save</button></div>`);button('linkRemote',()=>learnRemote(id));document.querySelectorAll('.unlink').forEach(b=>b.onclick=async()=>{try{await api(`remotes/${id}/learn/remove`,{id:b.dataset.remote});await refresh();edit(id);}catch(e){fail(e);}});button('saveName',async()=>{const travel=Number($('#travel').value);if(!Number.isInteger(travel)||travel<5||travel>300)throw Error('Travel time must be 5 to 300 seconds');await api(`remotes/${id}/travel`,{travel_time_s:travel});await api(`remotes/${id}/rename`,{name:$('#rename').value});close();await refresh();});button('delete',async()=>{if(!confirm('Delete this remote from the bridge? This does not unpair it from the motor. Download a backup first if you may need it again.'))return;await api(`remotes/${id}`,null,'DELETE');close();await refresh();});}
async function learnRemote(id){
 await api(`remotes/${id}/learn/start`,{});
 show('<h2>Listen for your remote.</h2><p>Briefly tap <strong>STOP once</strong> on the physical remote that already controls this shade. This may stop a moving shade.</p><div class="note">Use the channel you normally use for this shade. There is no need to press P2 or change motor pairing.</div><p id="learnStatus" role="status">Listening for up to 60 seconds…</p>','Link a physical remote');
 async function check(){if(!modal.open||!$('#learnStatus'))return;try{
  const d=await api(`remotes/${id}/learn/status`,{});
  if(d.candidate){show(`<h2>Remote found.</h2><p>We heard STOP from remote <strong>${esc(d.candidate)}</strong>. Was that the remote you just pressed?</p><div class="actions"><button id="listenAgain">Try again</button><button class="primary" id="linkConfirm">Yes, link this remote</button></div>`,'Link a physical remote');button('listenAgain',()=>learnRemote(id));button('linkConfirm',async()=>{await api(`remotes/${id}/learn/confirm`,{});close();await refresh();toast('Physical remote linked');});return;}
  if(!d.listening){$('#learnStatus').textContent='No remote detected. Close this dialog and try again closer to the bridge.';return;}
  learnTimer=setTimeout(check,600);
 }catch(e){fail(e);}}
 learnTimer=setTimeout(check,600);
}
$('#add').onclick=addShade;
$('#settings').onclick=()=>{show(`<h2>Bridge settings</h2><p>Your remotes live on this bridge. Download a backup before replacing it.</p><button id="backup">Download remote backup</button><details><summary>Home Assistant</summary><p>Install Simple Touch through HACS and restart Home Assistant. Open Devices &amp; services, select the discovered bridge, and enter the key below.</p><label for="bridgeKey">Bridge key</label><input id="bridgeKey" type="password" readonly value="${esc(key)}"><button id="copyKey">Copy key</button></details><details open><summary>Wi-Fi</summary><label for="ssid">Network name</label><input id="ssid" autocomplete="off"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password"><div class="actions"><button id="wifi" class="primary">Connect Wi-Fi</button></div><p class="small">Use a 2.4 GHz network. The setup hotspot closes two minutes after connecting.</p></details><details><summary>Restore an existing remote</summary><p class="small">Import one entry from your backup. Keep the old bridge powered off to avoid counter reuse.</p><input id="importFile" type="file" accept="application/json"><div id="imports"></div></details><details><summary>Firmware update</summary><p class="small">Select the application .bin for this board from a Simple Touch release.</p><input id="firmware" type="file" accept=".bin"><button id="update">Install update</button></details><details><summary>Radio calibration</summary><label for="frequency">Frequency in Hz</label><input id="frequency" type="number" value="${state?.frequency_hz||433925000}" min="433000000" max="434790000"><button id="calibrate">Save frequency</button></details>`,'Settings');button('backup',async()=>{const d=await api('backup');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='simple-touch-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});button('copyKey',async()=>{const input=$('#bridgeKey');input.type='text';input.select();if(navigator.clipboard)await navigator.clipboard.writeText(key);else document.execCommand('copy');toast('Bridge key selected/copied');});button('wifi',async()=>{await api('wifi',{ssid:$('#ssid').value,password:$('#password').value});toast('Connecting… Keep this page open to see the bridge address.');await refresh();});button('calibrate',async()=>{await api('radio',{frequency_hz:Number($('#frequency').value)});toast('Radio setting saved');});$('#importFile').onchange=async e=>{try{const b=JSON.parse(await e.target.files[0].text());if(b.format!==1||!Array.isArray(b.remotes))throw Error('Unsupported backup');$('#imports').innerHTML='';for(const r of b.remotes){const btn=document.createElement('button');btn.textContent='Import '+r.name;btn.onclick=async()=>{btn.disabled=true;try{await api('remotes',r);toast('Imported '+r.name);await refresh();}catch(err){fail(err);btn.disabled=false;}};$('#imports').append(btn);}}catch(e){fail(e);}};button('update',async()=>{const file=$('#firmware').files[0];if(!file)throw Error('Choose a firmware file first');const form=new FormData();form.append('firmware',file);const r=await fetch('/api/update',{method:'POST',headers:{Authorization:'Bearer '+key},body:form});const d=await r.json();if(!r.ok)throw Error(d.error);toast('Update installed. Bridge restarting.');close();});};
(async()=>{if(!key){try{const r=await fetch('/api/setup-key');if(r.ok){key=(await r.json()).key;sessionStorage.setItem('simpletouch-key',key);}}catch{}}await refresh();poll=setInterval(()=>{if(!busy)refresh();},5000);})();
</script></body></html>
